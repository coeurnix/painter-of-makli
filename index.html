<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painter of Makli</title>
  </head>
  <body>
    <div id="app">
      <canvas id="renderCanvas" aria-label="Painter of Makli game canvas"></canvas>

      <section id="splash" class="screen splash-screen" aria-label="Start screen">
        <div id="beginButton" class="splash-copy" role="button" tabindex="0">
          <span>Click anywhere to begin.</span>
          <span>Dreamed up by Coeurnix for <a href="https://itch.io/jam/token-jam-1" target="_blank" rel="noreferrer">Token Game Jam 1</a></span>
          <span>(MIT) <a href="https://github.com/coeurnix/painter-of-makli" target="_blank" rel="noreferrer"><span class="github-mark" aria-hidden="true">GitHub</span></a></span>
        </div>
      </section>

      <section id="mainMenu" class="screen main-menu main-menu-loading hidden" aria-label="Main menu">
        <video id="mainMenuVideo" class="main-menu-video" autoplay muted loop playsinline>
          <source src="/resources/mainmenu.webm" type="video/webm" />
          <source src="/resources/mainmenu.mp4" type="video/mp4" />
        </video>
        <button id="newGameButton" class="start-game-button" type="button">Start Game</button>
      </section>

      <section id="hud" class="hud hidden" aria-label="Game HUD">
        <div id="heartsContainer" class="hearts-container">
          <span class="heart">&#9829;</span>
          <span class="heart">&#9829;</span>
          <span class="heart">&#9829;</span>
        </div>
        <div class="score-display">Score <strong id="exploreScore">0</strong></div>
      </section>

      <section id="paintingScreen" class="screen painting hidden" aria-label="Painting mode">
        <div class="painting-hud painting-score">Score <strong id="paintScore">0</strong></div>
        <div class="painting-hud painting-timer"><strong id="paintTimer">60</strong></div>
        <div class="painting-canvas-wrap">
          <canvas id="paintingCanvas"></canvas>
        </div>
        <div id="paintingPrompt" class="painting-prompt">
          Paint only the subject and don't repaint areas
        </div>
      </section>

      <section id="cutsceneScreen" class="screen cutscene hidden" aria-label="Cutscene">
        <div class="video-frame">
          <video id="cutsceneVideo" playsinline></video>
          <div id="cutsceneFallback" class="cutscene-fallback" aria-hidden="true"></div>
        </div>
        <div id="skipIndicator" class="skip-indicator hidden" aria-hidden="true">
          <span>Skip</span>
          <div class="skip-fill"></div>
        </div>
      </section>

      <section id="stagePrompt" class="screen stage-prompt hidden" aria-label="Stage prompt">
        <div class="stage-prompt-copy">
          Click on the Bhut-Pret to protect Yusuf...
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
